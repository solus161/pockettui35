# pockettui35: log the session user in on tty1 with no prompt. @USER@ is
# filled in by the installer. The login shell then starts the launcher
# (/etc/profile.d/pockettui35.sh). When the session ends, getty restarts
# and logs in again.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin @USER@ --noclear %I $TERM
