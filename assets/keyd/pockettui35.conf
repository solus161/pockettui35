# pockettui35 keyd map for the Waveshare PocketTerm35.
#
# Needs the patched keyboard firmware: it sends F13-F18 for A B X Y L R,
# F21 for Select and F22 for Start, so the face buttons are not the letter
# keys. Stock firmware is not supported (docs/design.md, Input).
#
# keyd sits below everything: the console, cage and KMS apps all see the
# same map. Apps with `raw_buttons = true` get F13-F18 and F21 unmapped for
# their run (`pockettui35 keys raw`, through sudo); Start is never touched.
#
# A device id may be listed in one keyd config only: the installer moves an
# older pocketterm35.conf aside.

[ids]
1209:0001

[main]
# A: open, launch, confirm.
f13 = enter
# B: back, clear the search, stop.
f14 = esc
# X
f15 = tab
# Y: the menu bar in GTK, Firefox, LibreOffice.
f16 = f10
# L, R: to decide (docs/design.md, open questions).
f17 = pageup
f18 = pagedown
# Select: to decide. Passes through as F21.

# Start: a tap is F22, for games. Held for one second, it asks the launcher
# to close the running app or stop the running script. keyd runs commands
# as root; this one only signals the launcher.
#
# To verify on the device: keyd's manual words timeout() ambiguously. The
# intent is timeout(<tap>, <ms>, <hold>). Check with `sudo keyd monitor`.
f22 = timeout(f22, 1000, command(pkill -USR1 -x pockettui35))
